services:
  locadora-db:
    image: postgres:17
    container_name: locadora-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=locadora_db
    ports:
      - "5433:5432"
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d
      - locadora-db-data:/var/lib/postgresql/data
    restart: always

volumes:
  locadora-db-data:
    name: locadora-db-data